# Cloudflare deploy: the game page (site/) and the multiplayer room relay (server/).
# GitHub Actions runs `node tools/build.js` and `wrangler deploy` on every push to main.
name = "fate-grail-war"
main = "server/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./site"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
